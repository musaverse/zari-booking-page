  <link rel="stylesheet" href="assets/css/zari.css">

<body>
  <a class="skip" href="#view">Skip to content</a>

  <header class="topbar" id="topbar">

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
